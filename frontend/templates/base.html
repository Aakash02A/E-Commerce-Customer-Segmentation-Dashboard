<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Customer Segmentation Dashboard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
  {% block head %}{% endblock %}
</head>
<body class="d-flex">
  <nav class="sidebar text-white">
    <div class="sidebar-brand mb-3">
      <i class="bi bi-graph-up-arrow"></i>
      <span>Segmenter</span>
    </div>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/' }}" href="{{ url_for('pages.home') }}"><i class="bi bi-house-door"></i> Home</a></li>
      <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/upload' }}" href="{{ url_for('pages.upload') }}"><i class="bi bi-upload"></i> Upload Dataset</a></li>
      <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/mapping' }}" href="{{ url_for('pages.mapping') }}"><i class="bi bi-diagram-3"></i> Column Mapping</a></li>
      <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/validation' }}" href="{{ url_for('pages.validation') }}"><i class="bi bi-shield-check"></i> Data Quality</a></li>
      <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/dashboard' }}" href="{{ url_for('pages.dashboard') }}"><i class="bi bi-speedometer2"></i> Dashboard</a></li>
      <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/segments' }}" href="{{ url_for('pages.segments') }}"><i class="bi bi-people"></i> Segments</a></li>
      <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/customers' }}" href="{{ url_for('pages.customers') }}"><i class="bi bi-person-badge"></i> Customers</a></li>
      <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/history' }}" href="{{ url_for('pages.history') }}"><i class="bi bi-clock-history"></i> Analysis History</a></li>
      <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/settings' }}" href="{{ url_for('pages.settings') }}"><i class="bi bi-gear"></i> Settings / About</a></li>
    </ul>
  </nav>

  <main class="flex-grow-1 content">
    <div class="container-fluid py-4 px-4">
      <div id="global-alerts"></div>
      {% block content %}{% endblock %}
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/notifications.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
