name: CI

# Runs the full backend test suite (incl. PySpark) and validates the
# production Docker image on every push/PR to main, plus manual dispatch.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python 3.13 + PySpark)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # PySpark 4.2 requires a JVM (Java 17 or 21). Temurin 21 matches the
      # JDK used in the production Dockerfile.
      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # Spark runs local[*]; the app already pins spark.driver.host=127.0.0.1,
      # which keeps the driver binding valid on ephemeral CI hosts.
      - name: Run test suite
        working-directory: backend
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: python -m pytest

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t segmentation-dashboard:ci .

      - name: Smoke-test container health endpoint
        run: |
          docker run -d --name seg-ci -p 5000:5000 segmentation-dashboard:ci
          # Wait for Gunicorn + the embedded Spark JVM to come up.
          for i in $(seq 1 30); do
            if docker exec seg-ci curl --fail --silent http://127.0.0.1:5000/api/health >/dev/null 2>&1; then
              echo "health OK after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "health check failed"
              docker logs seg-ci
              exit 1
            fi
            sleep 5
          done
          docker rm -f seg-ci
